<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | KrishiSaathi AI</title>

    <link rel="stylesheet"
          href="/static/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🌱
        </div>

        <h1>Create your account</h1>

        <p class="auth-subtitle">
            Start your smart farming journey
        </p>

        <form id="signupForm">

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="farmer@example.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button type="submit"
                    class="auth-button">

                Create Account

            </button>

        </form>

        <p id="authMessage"
           class="auth-message"></p>

        <div class="auth-switch">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

<script>
    window.KRISHISAATHI_SUPABASE_URL =
        "{{ supabase_url }}";

    window.KRISHISAATHI_SUPABASE_KEY =
        "{{ supabase_publishable_key }}";
</script>

<script src="/static/auth.js"></script>

</body>
</html>
